<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Deployment Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .status-badge {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 12px;
    }
    p {
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background-color: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #30363d;
    }
    .counter {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-badge">Deployment Successful 🎉</div>
    <h1>GitHub Pages Test</h1>
    <p>If you can see this styled card, your repository has been successfully pushed and deployed to GitHub Pages.</p>
    
    <button id="clickBtn">Test Interactive Script</button>
    <div class="counter">Clicks: <span id="count">0</span></div>
  </div>

  <script>
    let clicks = 0;
    const btn = document.getElementById('clickBtn');
    const countDisplay = document.getElementById('count');

    btn.addEventListener('click', () => {
      clicks++;
      countDisplay.textContent = clicks;
    });
  </script>

</body>
</html>
